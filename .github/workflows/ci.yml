name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff mypy coverage

      - name: Lint
        run: ruff check hooks/ --select E,F,W --ignore E501

      - name: Type check
        run: mypy hooks/review_gate.py --ignore-missing-imports --no-error-summary 2>&1 || true

      - name: Run tests
        run: bash hooks/run_tests.sh

      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -t tests
          coverage report --fail-under=70
